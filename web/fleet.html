<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0f14">
<title>관제 화면 — 차량별 졸음·한눈팔기 경보</title>
<style>
  :root { --bg: #0b0f14; --panel: #131a22; --line: #243140; --text: #e8eef5; --dim: #8b9bb0;
    --l1: #f2c14e; --l2: #f08a3c; --l3: #ff3b4e; --accent: #5bc0ff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  body { padding: 16px 16px 40px; }
  main { max-width: 980px; margin: 0 auto; }
  h1 { font-size: clamp(22px, 4.6vw, 32px); margin: 4px 0 6px; letter-spacing: -0.02em; text-wrap: balance; }
  header p { margin: 0 0 14px; color: var(--dim); font-size: 14.5px; line-height: 1.55; }
  a { color: var(--accent); }
  .tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  @media (max-width: 760px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .tile, .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .tile small { color: var(--dim); font-size: 12.5px; display: block; margin-bottom: 4px; }
  .tile b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 12px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 0 0 10px; }
  #hourly { display: block; width: 100%; height: 150px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--dim); font-weight: 500; padding: 4px 8px 8px 0; white-space: nowrap; }
  td { padding: 7px 8px 7px 0; border-top: 1px solid var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .num { text-align: right; }
  .lv { display: inline-block; min-width: 38px; text-align: center; border-radius: 6px; padding: 1px 6px; font-weight: 700; color: #0b0f14; }
  .lv1 { background: var(--l1); } .lv2 { background: var(--l2); } .lv3 { background: var(--l3); color: #fff; }
  .seed { color: var(--dim); }
  .legend { display: flex; gap: 12px; font-size: 11.5px; color: var(--dim); margin-top: 6px; }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
  #status { color: var(--dim); font-size: 12.5px; margin: 12px 2px 0; line-height: 1.6; }
</style>
</head>
<body>
<main>
  <header>
    <h1>관제 화면 — 차량별 졸음·한눈팔기 경보</h1>
    <p>운전석에서 난 경보가 PostgreSQL에 쌓이고, 관제실은 여기서 차량별로 봅니다.
       <a href="./index.html">체험 화면</a>에서 카메라를 켜고 눈을 2초 감으면 몇 초 뒤 아래 목록 맨 위에 올라옵니다.</p>
  </header>

  <div class="tiles">
    <div class="tile"><small>24시간 경보(상위 20대)</small><b id="tAll">-</b></div>
    <div class="tile"><small>그중 즉시 경보(레벨 3)</small><b id="tCrit" style="color:var(--l3)">-</b></div>
    <div class="tile"><small>졸음(눈 감김)</small><b id="tDrowsy">-</b></div>
    <div class="tile"><small>표시 차량</small><b id="tVeh">-</b></div>
  </div>

  <div class="panel" style="margin-bottom:12px">
    <h2>최근 7일, 시간대별 경보 건수</h2>
    <canvas id="hourly" width="1800" height="300"></canvas>
    <div class="legend"><span><i style="background:var(--l1)"></i>주의</span><span><i style="background:var(--l2)"></i>위험</span><span><i style="background:var(--l3)"></i>경보</span></div>
  </div>

  <div class="grid">
    <div class="panel"><h2>24시간, 즉시 경보가 많은 차량</h2>
      <div class="scroll"><table><thead><tr><th>차량</th><th class="num">경보</th><th class="num">레벨 3</th><th class="num">졸음</th><th>마지막</th></tr></thead><tbody id="vehicles"></tbody></table></div></div>
    <div class="panel"><h2>방금 들어온 경보</h2>
      <div class="scroll"><table><thead><tr><th>시각</th><th>차량</th><th>레벨</th><th>사유</th><th class="num">지속</th></tr></thead><tbody id="recent"></tbody></table></div></div>
  </div>

  <p id="status"></p>
</main>
<script type="module" src="./fleet.js"></script>
</body>
</html>
